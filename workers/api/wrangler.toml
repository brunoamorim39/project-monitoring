name = "project-monitoring"
main = "src/index.ts"
compatibility_date = "2024-01-15"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "project-monitoring"
database_id = "752e259b-c151-431a-8d11-62252d75b876"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "54ab8c158476446baad54ee0823a7772"

[vars]
# Public variables (non-sensitive)
ENVIRONMENT = "production"

# Add these to .dev.vars for local development:
# ADMIN_USERNAME=admin
# ADMIN_PASSWORD=your-secure-password
